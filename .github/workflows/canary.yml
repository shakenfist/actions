# Post-merge canary for shakenfist/actions.
#
# Every project in the fleet consumes this repository at @main, so a
# merge here is a deploy: there is no staging step between landing a
# change and every downstream CI run picking it up. Pre-merge testing
# cannot close that gap, because `uses:` does not accept an expression
# and the composite action references inside smoke-cluster.yml are
# therefore pinned to @main. A downstream run against a branch of this
# repository still pulls build-smoke-cluster@main -- the old version.
#
# This workflow does not prevent a bad merge, it bounds how long one
# goes unnoticed. It calls smoke-cluster.yml by relative path, so
# immediately after a merge every piece involved -- the reusable
# workflow, the composite actions it names at @main, and the scripts
# under tools/ -- is the just-merged code, deployed against the
# development branches of shakenfist, client-python and agent-python.
# That is the same combination the next downstream CI run will get.
#
# The alternative considered was dispatching a run in
# shakenfist/shakenfist. That needs a cross-repository token and tests
# the same thing less directly, since the checkout that matters is
# still actions@main either way.
name: Post-merge canary

on:
  push:
    branches: [main]
    # Documentation cannot change what the actions do, and a smoke
    # cluster is an expensive way to find that out. The same goes for
    # the review-tracking artifacts: recording a review writes a
    # weAudit file and its sidecar, which are neither markdown nor
    # under docs/, and with 80-odd files to work through one at a time
    # a stamping merge is the routine commit type this repository now
    # creates. ('**.md' already covers REVIEWS.md.) This list has to
    # stay ahead of ci.yml's path filter, and
    # tests/test_workflow_references.py checks that it does: every
    # pattern that filter excludes must be named or subsumed here.
    #
    # The two are not identical, deliberately. '**.md' reaches further
    # than the filter's '!docs/**' and '!REVIEWS.md', so a change to
    # README.md or AGENTS.md is still linted but does not book a
    # cluster -- markdown cannot alter an action. review-scope.toml is
    # ignored here for the same reason, while the filter does not
    # exclude it, because the unit tests read it.
    #
    # Content scanners get no such exemption anywhere: a filter skips
    # prose, and prose is where a secret or a smuggled character
    # lands. That is why ci.yml's gitleaks job does not consume its
    # path filter, and it is why nothing here is a reason to widen
    # this list to documentation the scanner should still read.
    #
    # The second group is code, but code the smoke cluster never runs:
    # the composite actions it does not use, this repository's own
    # tests, the workflows other than smoke-cluster.yml and this one,
    # and repository configuration. A canary for a change to
    # review-pr-with-claude or a Renovate bump boots a cluster and
    # passes, whatever the change did -- 21 of the 68 canaries from
    # 25 September to 25 October were that, about 14 runner-hours on
    # the s-cloud pool, and none of them could have failed. Those
    # changes are covered where they are used: by their own unit tests
    # in ci.yml, by proxmox-substrate.yml, and by the downstream runs
    # that consume them.
    #
    # Two things keep this list honest, both in
    # tests/test_workflow_references.py. Nothing listed here may be
    # used by the smoke lane -- smoke-cluster.yml, the composite
    # actions it names and the tools/ scripts those run -- so that a
    # change the canary does exercise is never skipped. And the list
    # names paths, never a broader glob, so that something new (a new
    # composite action, a new workflow) books a canary until somebody
    # decides it should not: the default stays the safe direction.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.vscode/*.weaudit'
      - '.vscode/*.weaudit-shas.json'
      - '.vscode/review-scope.toml'
      - 'check-dist/**'
      - 'deploy-kolla-ansible/**'
      - 'deploy-proxmox-on-shakenfist/**'
      - 'pr-bot-trigger/**'
      - 'pr-review-ref/**'
      - 'require-ci-success/**'
      - 'review-pr-with-claude/**'
      - 'setup-kerbside-environment/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/codeql-analysis.yml'
      - '.github/workflows/export-repo-config.yml'
      - '.github/workflows/issue-link-check.yml'
      - '.github/workflows/pr-auto-review.yml'
      - '.github/workflows/pr-re-review.yml'
      - '.github/workflows/pr-retest.yml'
      - '.github/workflows/proxmox-substrate.yml'
      - '.github/workflows/prune-reviews.yml'
      - '.github/workflows/renovate.yml'
      - '.github/actionlint.yaml'
      - '.flake8'
      - '.gitleaks.toml'
      - '.pre-commit-config.yaml'
      - 'renovate.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke cluster
    # component is used for concurrency grouping, logging and the
    # bundle artifact name, not for checkout control:
    # setup-test-environment checks this repository out with no ref, so
    # it resolves main at the moment that step runs -- normally, but not
    # always, the commit that triggered this run. Two merges landing
    # inside a smoke cluster's runtime would have the first canary
    # checking out the second commit. That does not produce a
    # misattributed result: smoke-cluster.yml's concurrency group is
    # keyed on component, tier and ref, and both runs share
    # refs/heads/main, so the earlier canary is cancelled rather than
    # reporting on code it did not test.
    #
    # No "secrets: inherit". smoke-cluster.yml reads no secret -- it
    # authenticates to cluster nodes with the on-disk /srv/github/id_ci
    # key -- so inheriting the repository's secrets buys nothing. If an
    # input ever does need one, declare it by name in the workflow_call
    # block and pass it by name.
    uses: ./.github/workflows/smoke-cluster.yml
    with:
      component: actions
      component_ref: ${{ github.sha }}
      # Not gated on the headroom band. The band is fitted against the job
      # shapes shakenfist's warn window measured -- its merge matrix, on
      # slim-primary and slim-tier -- and a single-node smoke cloud is not
      # one of them. The verdict is still printed. Stated rather than left
      # to the input's default so the choice is visible here, and
      # tests/test_ci_headroom_verdict.py pins it.
      headroom_gate: false
      tier: smoke

  # A canary nobody looks at is not a canary. A failed run on main
  # emails whoever pushed, which is easy to miss when the push was a
  # merge; this puts it somewhere the whole fleet can see, because a
  # broken actions@main is everyone's problem rather than the author's.
  report-failure:
    name: Report canary failure
    needs: [smoke]
    if: failure()
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      # One issue per outage, not one per merge. A canary that stays
      # red for a day should not file a day's worth of issues, so an
      # existing open report is commented on instead.
      # gh issue create fails outright if the label does not exist, so
      # the report would be lost at exactly the moment it is wanted.
      # --force makes this idempotent.
      - name: Ensure the canary label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create canary \
              --repo "${GITHUB_REPOSITORY}" \
              --description "Post-merge canary failure on main" \
              --color d73a4a --force

      - name: File or update the canary failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          existing=$(gh issue list --repo "${GITHUB_REPOSITORY}" \
              --label canary --state open --limit 1 --json number \
              --jq '.[0].number // empty')

          # printf rather than a multi-line double-quoted string. A
          # quoted string here carries this file's indentation into
          # every continuation line, and four leading spaces make
          # GitHub-flavoured Markdown render the whole body as a code
          # block -- the run URL stops being a link, which defeats the
          # point of filing the issue.
          body=$(printf '%s\n' \
              "The post-merge canary failed for ${SHA}." \
              "" \
              "Run: ${RUN_URL}" \
              "" \
              "actions@main is what every downstream project resolves" \
              "at runtime, so their CI is likely to be failing too" \
              "until this is fixed or reverted.")

          if [ -n "${existing}" ]; then
              echo "Commenting on existing canary issue #${existing}."
              gh issue comment "${existing}" --repo "${GITHUB_REPOSITORY}" \
                  --body "${body}"
          else
              echo "Filing a new canary issue."
              gh issue create --repo "${GITHUB_REPOSITORY}" \
                  --title "Post-merge canary failing on main" \
                  --label canary \
                  --body "${body}"
          fi
