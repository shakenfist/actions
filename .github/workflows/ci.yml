# CI for shakenfist/actions itself.
#
# This repository ships composite actions and reusable workflows that
# every other project in the fleet consumes at @main, so a bad merge
# here reaches everything at once. It had no CI of its own until this
# workflow: the three other files in this directory are all
# workflow_call-only, invoked by downstream projects, and nothing ran
# on a pull request against this repository.
#
# What can and cannot be tested here is worth being explicit about,
# because the gap is structural rather than an oversight. `uses:` does
# not accept an expression, so the composite action references inside
# smoke-cluster.yml are pinned to @main and cannot be repointed at a
# pull request's ref. A downstream functional-test run against a branch
# of this repository therefore still pulls build-smoke-cluster@main --
# it exercises the old version, not the change under review. Composite
# action changes are only integration-tested after they have landed,
# which is what canary.yml exists to bound.
#
# So this workflow covers what is checkable without a cluster: the
# workflow and action YAML, the ~2300 lines of shell, the ~2400 lines
# of Python, and the repository's history. See docs/ci.md.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Which of the lanes below are worth paying for on this pull
  # request. Every job in this workflow runs on an ephemeral VM, so a
  # documentation typo used to book four of them; this job runs on a
  # static runner and costs nothing by comparison.
  #
  # The gitleaks job deliberately does not consume this output. A
  # scanner exists to read the human-written text a filter skips --
  # docs and review notes are prose, and prose is where a secret or a
  # smuggled character lands -- so filtering it would defeat the point
  # of running it. That is the same rule the consistency audit's
  # expensive-lane-path-filter check applies, and the same reason
  # content scanners stay out of paths-ignore in the review-tracking
  # adoption procedure.
  #
  # The hygiene hooks are not similarly exempt, and that is an
  # accepted loss rather than an oversight: skipping lint on a
  # documentation-only pull request also skips check-merge-conflict,
  # trailing-whitespace and end-of-file-fixer, whose subject matter is
  # precisely markdown. A stray conflict marker in docs/ would merge
  # unremarked. Running them here instead would mean executing the
  # branch's pre-commit configuration on a static runner, which is the
  # one thing this job is careful not to do. gitleaks still reads
  # every one of those files, so what escapes is formatting, not
  # content.
  #
  # automated_reviewer needs lint and unit-tests, so it skips when
  # they do, without a condition of its own: a job whose dependency
  # was skipped is skipped. That is intended -- LLM credits are the
  # other thing worth not spending on a typo.
  check_paths:
    name: "Check paths"
    runs-on: [self-hosted, static]
    timeout-minutes: 10
    # paths-filter calls pulls.listFiles rather than reading the
    # working tree (see below), and the top-level permissions block
    # sets every scope it does not name to none. This repository is
    # public, so the call would most likely succeed on public-data
    # read alone -- which is exactly why the omission would sit here
    # until it did not.
    permissions:
      pull-requests: read
    outputs:
      code_changed: ${{ steps.filter.outputs.code || 'true' }}
    steps:
      # There is deliberately no checkout step. On a pull_request
      # event paths-filter takes its `if (token)` branch and reads the
      # changed-file list from pulls.listFiles, so it never looks at
      # the working tree -- upstream says as much: "For pull requests
      # it's not necessary to checkout the code". That is why this job
      # carries no fork guard while every lane below does: without a
      # checkout, a fork's file content never reaches this long-lived
      # static runner at all.
      #
      # The step is still skipped on workflow_dispatch, which has no
      # pull request payload for the action to read.
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          # By default a file matches if it matches at least one
          # listed pattern, which makes '**' match everything and
          # silently defeats every '!' exclusion below.
          # 'some-with-excludes' means a file is code if it matches
          # any inclusion and no exclusion, which is both what is
          # meant here and what stays correct if a second inclusion is
          # ever added. ('every' also behaves correctly today, but
          # only because there is exactly one positive pattern: it
          # requires a file to match ALL of them, so adding a second
          # inclusion would silently turn this into an intersection
          # matching almost nothing.)
          predicate-quantifier: 'some-with-excludes'
          #
          # .vscode/review-scope.toml is deliberately NOT excluded,
          # unlike the two generated files beside it. It is hand
          # edited, and the unit tests read it -- a typo in a pattern
          # does not fail anything, it silently shrinks the set of
          # files under review. canary.yml does ignore it, because
          # there the criterion is "can this change what an action
          # does", and it cannot.
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!REVIEWS.md'
              - '!.vscode/*.weaudit'
              - '!.vscode/*.weaudit-shas.json'

  lint:
    name: Lint
    # SECURITY: fork pull requests do not run this job. It executes
    # the pull request's own code on a self-hosted runner --
    # pre-commit clones and runs whatever repos .pre-commit-config.yaml
    # names, the unit-tests job imports the branch's test files, and
    # gitleaks-scan.sh is the branch's own shell script. These runners
    # hold /srv/github/id_ci, the key smoke-cluster.yml and
    # tools/run_remote use to reach every node in the CI mesh, so code
    # execution here reaches the whole cluster estate.
    # pr-auto-review.yml carries the same condition for the same
    # reason. A skipped job still satisfies branch protection, so this
    # does not wedge a required check. See docs/ci.md.
    #
    # That last property is also why the filter has to fail open. By
    # default a job whose dependency did not succeed is skipped, so
    # without !cancelled() any failure of check_paths -- a transient
    # action-resolution error, a listFiles 403, a malformed filter
    # block -- would read as "lint never ran and the required checks
    # are green" on a repository where a merge to main deploys to ten
    # others. !cancelled() overrides that default; a failed
    # check_paths yields no output, and an empty output is != 'false',
    # so the lane runs. Only a filter that positively said 'false'
    # skips it.
    needs: [check_paths]
    if: |
      !cancelled()
      && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, vm, debian-12, s]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-lint
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      - name: Install pre-commit
        run: |
          python3 -m venv /tmp/venv-lint
          . /tmp/venv-lint/bin/activate
          pip install --quiet pre-commit

      # This is also where skillsaw (https://github.com/stbenjam/skillsaw)
      # runs, as a pre-commit hook: it lints AGENTS.md and any agent
      # context added later for malformed frontmatter, embedded
      # credentials and invisible-unicode smuggling.
      #
      # SKIP=unit-tests because the unit-tests job below owns that
      # check. Running it here as well would report the same failure
      # under two names and hold a second runner to do it.
      - name: Run pre-commit hooks
        env:
          SKIP: unit-tests
        run: |
          . /tmp/venv-lint/bin/activate
          pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: Unit tests
    # SECURITY: fork pull requests do not run this job, for the
    # reason set out on the lint job above. The !cancelled() term
    # makes the path filter fail open, also for the reason set out
    # there.
    needs: [check_paths]
    if: |
      !cancelled()
      && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
      && needs.check_paths.outputs.code_changed != 'false'
    runs-on: [self-hosted, vm, debian-12, s]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-unit-tests
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7

      # PyYAML is the suite's one dependency: the inventory tests parse
      # the generated inventory to check its group structure, and every
      # other assertion in that file is substring matching which would
      # pass on malformed YAML. It is installed explicitly rather than
      # assumed present, because the test used to skip itself when the
      # import failed -- and a skip is not a failure, so nobody would
      # have noticed the one test that validates the output stop
      # running. It is imported at module scope now, so a missing
      # PyYAML is a hard error here and locally.
      #
      # From apt rather than pip: there is no package to install first
      # and no requirements file, deliberately, because this repository
      # is not a Python project and growing a pyproject.toml just to
      # run tests would make it one.
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-yaml

      # Plain unittest, run from the repository root.
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -t . --verbose

  gitleaks:
    name: gitleaks
    # SECURITY: fork pull requests do not run this job, for the
    # reason set out on the lint job above.
    if: |
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, vm, debian-13, s]
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-gitleaks
      cancel-in-progress: true
    steps:
      # fetch-depth: 0 matters. A secret committed and then reverted is
      # still in the history and still needs rotating, and a shallow
      # clone would make this job report a clean history it never
      # looked at.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # gitleaks-action@v2 refuses to run on organization repositories
      # without a paid licence, so the upstream binary is invoked
      # directly. gitleaks is only packaged from Debian 13 (trixie)
      # onward, which is why this job wants a debian-13 runner.
      - name: Install gitleaks
        run: sudo apt-get update && sudo apt-get install -y gitleaks

      # The scan proper lives in a script so it runs the same way
      # locally as it does here -- including its positive control,
      # which is the part that distinguishes "scanned and found
      # nothing" from "scanner is broken".
      - name: Run gitleaks
        run: tools/gitleaks-scan.sh

  automated_reviewer:
    name: "Automated reviewer"
    # The needs: list is the "review only once CI has passed" gate. A
    # job skipped because a dependency failed never starts the
    # reusable workflow.
    needs: [lint, unit-tests, gitleaks]
    # A reusable workflow cannot grant itself more token scope than its
    # caller has, so the permissions go here.
    permissions:
      contents: read
      pull-requests: write
      issues: write
    # Called by relative path rather than @main, so a pull request
    # which changes the reviewer workflow is reviewed by its own
    # version. Note this only reaches one level: the workflow's inner
    # reference to review-pr-with-claude is still @main, because that
    # is an action reference and `uses:` takes no expression there.
    #
    # No "secrets: inherit" -- nothing in the reviewer reads a secret,
    # it authenticates with github.token from the permissions above.
    uses: ./.github/workflows/pr-auto-review.yml
