# Triggers a re-run of this repository's test workflow when an
# authorized user comments "@shakenfist-bot please retest"
#
# This is useful after bot commits (which don't trigger CI) or when you
# want to re-run checks without pushing a new commit.
#
# The workflow it dispatches is the RETEST_WORKFLOW repository variable,
# or functional-tests.yml when that is unset. A repository whose tests
# live in another file -- ci.yml, say -- sets the variable (Settings >
# Secrets and variables > Actions > Variables) rather than editing this
# file, so every copy stays byte-identical to the template. Whatever it
# names must carry a workflow_dispatch trigger.
#
# Template source: shakenfist/development/templates/ci-review-automation/

name: PR Retest

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write
  actions: write

jobs:
  trigger-retest:
    name: "Trigger retest"
    # Only run on PR comments (not issue comments)
    # Never on a comment the bot itself posted. The automated review
    # is model-generated text posted to the pull request, and a review
    # quoting a trigger phrase would re-fire the lane -- contains()
    # does not care that the phrase sits inside a quote.
    if: |
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '@shakenfist-bot please retest')
    runs-on: [self-hosted, static]
    # Just a few gh API calls, so anything beyond this is a hang.
    timeout-minutes: 10
    outputs:
      confirmed: ${{ steps.trigger.outputs.confirmed }}
      same_repo: ${{ steps.trigger.outputs.same-repo }}
      pr_ref: ${{ steps.trigger.outputs.pr-ref }}
      pr_number: ${{ github.event.issue.number }}

    steps:
      # pr-bot-trigger vouches for its own outputs: `confirmed` is
      # 'true' only when the request was triggered, authorized and from
      # this repository with a pr-ref set, and when it cannot tell, the
      # action fails and says so on the pull request itself. So this
      # file does not re-read the other outputs to check them.
      # pr-re-review.yml relies on it the same way.
      - name: Handle trigger
        id: trigger
        uses: shakenfist/actions/pr-bot-trigger@main
        with:
          trigger-phrase: 'please retest'
          reaction: 'rocket'

  retest:
    name: "Retest PR"
    needs: trigger-retest
    # same_repo is redundant -- pr-bot-trigger already folds it into
    # confirmed -- and it is here anyway. This job dispatches a
    # workflow against the pull request's ref with a write-scoped
    # token, so the fork guard is worth stating twice: a regression in
    # the shared action cannot quietly widen what runs here, and a
    # reader can see the restriction without leaving the file.
    # pr-re-review.yml does the same for the same reason.
    if: >-
      needs.trigger-retest.outputs.confirmed == 'true' &&
      needs.trigger-retest.outputs.same_repo == 'true'
    runs-on: [self-hosted, static]
    # A dispatch and a comment, so anything beyond this is a hang.
    timeout-minutes: 10
    # Someone commenting the phrase twice should not dispatch the test
    # suite twice. The dispatched workflow's own concurrency groups
    # limit the damage downstream, but they cancel a run that has
    # already started work; not starting it is cheaper. The last
    # request wins, which is why cancel-in-progress is true: a
    # cancelled trigger may have dispatched already, and the request
    # that cancelled it posts its own confirmation.
    #
    # The group is on this job rather than on trigger-retest, which is
    # why the dispatch and the confirmation live here at all.
    # trigger-retest runs for any non-bot comment carrying the phrase
    # and decides authorisation inside itself, so a group there would
    # let an unauthorised commenter cancel an authorised run in flight
    # -- leaving a dispatched test suite whose only trace on the pull
    # request is a refusal. This job is entered only once
    # pr-bot-trigger has said yes, so the group holds authorised
    # requests against each other and nothing else. pr-re-review.yml
    # has the same shape for the same reason.
    concurrency:
      group: pr-retest-${{ github.event.issue.number }}
      cancel-in-progress: true
    # The workflow a retest dispatches; see the header. Read once here,
    # and only through the environment, so both steps name the same
    # file and neither interpolates it into shell text.
    env:
      RETEST_WORKFLOW: ${{ vars.RETEST_WORKFLOW || 'functional-tests.yml' }}

    steps:
      - name: Dispatch the retest workflow
        id: dispatch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REF: ${{ needs.trigger-retest.outputs.pr_ref }}
          REPO: ${{ github.repository }}
        run: |
          echo "Dispatching ${RETEST_WORKFLOW} on branch: ${PR_REF}"

          # Report a failed dispatch rather than claiming success.
          # Fork pull requests no longer reach this step -- pr-bot-trigger
          # refuses them and says why -- so what is left is a workflow
          # file that is missing, renamed or disabled.
          if gh workflow run "${RETEST_WORKFLOW}" \
            --repo "${REPO}" \
            --ref "${PR_REF}"; then
            echo "dispatched=true" >> $GITHUB_OUTPUT
            echo "Dispatched ${RETEST_WORKFLOW} successfully"
          else
            echo "dispatched=false" >> $GITHUB_OUTPUT
            echo "Dispatching ${RETEST_WORKFLOW} failed"
          fi

      - name: Post confirmation
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_REF: ${{ needs.trigger-retest.outputs.pr_ref }}
          PR_NUMBER: ${{ needs.trigger-retest.outputs.pr_number }}
          REPO: ${{ github.repository }}
          DISPATCHED: ${{ steps.dispatch.outputs.dispatched }}
        run: |
          if [ "${DISPATCHED}" = "true" ]; then
            gh pr comment "${PR_NUMBER}" \
              --repo "${REPO}" \
              --body "Triggered \`${RETEST_WORKFLOW}\` on branch \`${PR_REF}\`.

          [View workflow runs](https://github.com/${REPO}/actions/workflows/${RETEST_WORKFLOW})"
          else
            gh pr comment "${PR_NUMBER}" \
              --repo "${REPO}" \
              --body "Unable to trigger \`${RETEST_WORKFLOW}\` on \`${PR_REF}\`. Check that \`${RETEST_WORKFLOW}\` exists on the default branch, carries a \`workflow_dispatch\` trigger, and is not disabled, and that the \`RETEST_WORKFLOW\` repository variable names this repository's test workflow if it is not \`functional-tests.yml\` -- or re-run the failed workflow from the Actions tab instead."
            # Fail the run too, after the comment has explained why, so a
            # request that did nothing does not show green in Actions.
            exit 1
          fi
