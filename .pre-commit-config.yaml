# Pre-commit hooks for shakenfist/actions.
#
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files
#
# This repository holds no packaged Python, so there is no tox and no
# pyproject.toml to hang test configuration off. Hooks therefore either
# come from upstream (which pre-commit installs into its own cached
# environments) or run a script from the tree directly.
#
# Two linters are deliberately absent, and are tracked as follow-up work
# rather than silently dropped:
#
#   * yamllint reports 191 problems on ansible/ even with a 120 column
#     limit, mostly `truthy` on ansible's idiomatic yes/no values.
#   * ansible-lint reports 732 failures, 334 of which are `fqcn` asking
#     for ansible.builtin. prefixes on every task.
#
# Both are real backlogs, but gating on them today would mean either a
# large mechanical rewrite of the CI playbooks or a configuration that
# disables so much it asserts nothing. See docs/ci.md.

repos:
  # Standard hygiene. These rewrite files rather than only reporting.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      # The weAudit file and its sidecar are generated without a
      # trailing newline, so these two rewrite them on every
      # `pre-commit run --all-files` and then report a failure that
      # cannot usefully be fixed -- committing the newline only means
      # the next regen drops it again. Scoped to these two hooks
      # rather than set at the top level: a blanket exclude would
      # also hide review notes from gitleaks and check-json, and
      # review notes are prose, which is exactly where a secret could
      # land. Note that holds for a local run; in CI a stamp-only
      # pull request skips the whole lint job on the path filter, so
      # check-json sees the sidecar only locally. gitleaks does not
      # consume that filter and still reads everything. See
      # docs/ci.md.
      - id: trailing-whitespace
        exclude: ^\.vscode/.*\.weaudit
      - id: end-of-file-fixer
        exclude: ^\.vscode/.*\.weaudit
      - id: check-merge-conflict
      - id: check-json
      - id: check-executables-have-shebangs

  # GitHub Actions workflow linter. This repository is a library of
  # composite actions and reusable workflows, so this is the hook that
  # covers most of what it actually ships. It reads .github/actionlint.yaml
  # for the self-hosted runner labels.
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.7
    hooks:
      - id: actionlint
        name: Lint GitHub Actions workflows

  # shellcheck over the ~2300 lines of shell in tools/ and
  # review-pr-with-claude/.
  #
  # Gated at error severity rather than the default. The tree currently
  # carries 31 warning-level findings (SC2046 unquoted command
  # substitution, SC2034 unused variables, SC2164 unchecked cd) spread
  # across seventeen scripts which run on remote CI nodes and cannot be
  # exercised locally. Fixing them blind, in one change that is also
  # standing CI up for the first time, trades one risk for a larger one.
  # Raise this to warning once they have been worked through.
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
        args: [--severity=error]

  # skillsaw lints agent context -- AGENTS.md here, plus any skills,
  # hooks or MCP configuration added later -- for malformed frontmatter,
  # embedded credentials and invisible-unicode smuggling. Agent context
  # is code an agent executes against, and it is the material a secret
  # scanner is least likely to be pointed at.
  - repo: https://github.com/stbenjam/skillsaw
    rev: v0.18.0
    hooks:
      - id: skillsaw

  # flake8 over the Python helpers, at the fleet's 120 column limit.
  - repo: https://github.com/pycqa/flake8
    rev: 7.3.0
    hooks:
      - id: flake8

  # Unit tests for the Python helpers. These are plain unittest, run
  # directly, matching how shakenfist/development tests its own audit
  # scripts -- there is no package here to install first.
  - repo: local
    hooks:
      - id: unit-tests
        name: Run unit tests
        description: Unit tests for the Python helper scripts in tools/ and review-pr-with-claude/
        entry: python3 -m unittest discover -s tests -t .
        language: system
        pass_filenames: false
        files: \.py$
