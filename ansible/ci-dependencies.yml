- hosts: localhost
  gather_facts: no
  connection: ssh
  vars:
    identifier: unknown
    sshkey: '/srv/github/id_ci.pub'
    ssh_private_key: '/srv/github/id_ci'
    base_image: "debian:13"
    base_image_user: "debian"
    # When this playbook runs on a CI runner, the runner shares the
    # builder instance's virtual network and can ssh to its inner
    # address. When conductor runs it directly on maui, only floating
    # IPs are routable, so float_builder=true gives the builder
    # instance a floating IP and sshs to that instead.
    float_builder: false

  tasks:
    - name: Create an instance
      shakenfist.shakenfist.sf_instance:
        name: "rebuild-dependencies"
        cpu: 4
        ram: 4096
        disks:
          - "100@{{base_image}}"
          - "50"
        networkspecs:
          - "network_uuid={{identifier}}{% if float_builder | bool %},float=true{% endif %}"
        ssh_key: "{{ lookup('file', sshkey) }}"
        user_data: "{{ lookup('file', 'files/user-data') | b64encode }}"
        namespace: "{{identifier}}"
        state: present
        await: true
        await_timeout: 600
      register: imagerebuild_instance

    - name: Log instance
      debug:
        msg: "{{imagerebuild_instance}}"

    # This playbook is only ever invoked to build the `dependencies`
    # image, which is moving to debian:13, so nothing will pass
    # base_image: debian:11 again. A python-interpreter branch that
    # exists for a base image this playbook can no longer receive is
    # still something the next reader has to rule out, so it is gone
    # rather than left dormant.
    - name: Add to ansible
      add_host:
        hostname: imagerebuild
        ansible_ssh_host: "{{ imagerebuild_instance['meta']['interfaces'][0]['floating'] if float_builder | bool else imagerebuild_instance['meta']['interfaces'][0]['ipv4'] }}"
        ansible_ssh_extra_args: "-o StrictHostKeyChecking=no -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/dev/null"
        ansible_ssh_user: "{{base_image_user}}"
        ansible_ssh_private_key_file: "{{ ssh_private_key }}"
        sf_instance_uuid: "{{imagerebuild_instance['meta']['uuid']}}"
        groups: allsf

    - name: Log instance
      debug:
        msg: "{{hostvars['imagerebuild']}}"

    # Cheap early gate: a banner means sshd is listening, which is not the
    # same as the guest being ready -- see tasks/wait-for-cloud-init.yml,
    # imported by the readiness play below, for what this does not prove.
    # Keep it anyway as a fast failure for a guest that never booted.
    - name: Wait for instance to present an "OpenSSH" prompt
      wait_for:
        port: 22
        host: "{{hostvars['imagerebuild']['ansible_ssh_host']}}"
        search_regex: OpenSSH
        delay: 10

# Readiness gate -- see tasks/wait-for-cloud-init.yml for why the banner
# wait above is not enough on its own. Here it also keeps the package
# operations below from fighting cloud-init for the dpkg lock.
- name: Wait for the instance to finish cloud-init
  hosts: allsf
  gather_facts: false
  tasks:
    - import_tasks: tasks/wait-for-cloud-init.yml

- hosts: allsf
  gather_facts: yes
  become: true
  environment:
    http_proxy: http://192.168.1.15:3128
    https_proxy: http://192.168.1.15:3128
    HTTP_PROXY: http://192.168.1.15:3128
    HTTPS_PROXY: http://192.168.1.15:3128
    no_proxy: localhost,127.0.0.1,10.0.0.0/8
    NO_PROXY: localhost,127.0.0.1,10.0.0.0/8
  vars:
    actions_url: ""
    gitlab_testdata_token: ""

  tasks:
    - name: Make a directory for cached images
      file:
        path: /srv/ci/cached
        state: directory
        mode: "0755"

    # This disk is snapshotted and becomes the `dependencies` label, which
    # every runner attaches as its second disk and mounts read-write at
    # /srv/ci with no special options (see the `Mount /srv/ci` tasks in
    # the ci-topology-*.yml playbooks in this directory, which mount
    # /dev/vdc as-is). The oldest consumer still boots
    # ubuntu2004-ci-template.qcow2 on kernel 5.4, and the debian-11 and
    # rocky-9 boot labels run 5.10 and 5.14, so this one filesystem has
    # to be readable across a wide span of kernels. That makes its
    # on-disk format a decision worth making, and a bare mkfs.ext4 does
    # not make it: the format is then whatever the builder
    # distribution's mke2fs.conf happens to ship, so moving the builder
    # from Debian 11 to Debian 13 changed it as a side effect. Debian 13
    # ships e2fsprogs 1.47, which enables orphan_file (Linux 5.15) by
    # default. Nothing here would have broken over that -- orphan_file
    # is a COMPAT feature, so a kernel that does not implement it
    # ignores it and still mounts read-write, and the
    # RO_COMPAT_ORPHAN_PRESENT bit that would actually hold such a
    # kernel back is only set while the orphan file holds entries and
    # is cleared by the clean unmount this playbook does before
    # snapshotting. The objection is not that it was dangerous, it is
    # that nobody chose it.
    #
    # So the feature set is named in full. The `none,` prefix is what
    # makes that a pin rather than a wish: `-O` adds to and subtracts
    # from the mke2fs.conf set rather than replacing it, so an explicit
    # list on its own would still pick up whatever a future e2fsprogs
    # adds. The list is exactly what e2fsprogs 1.47.2 produces today,
    # and it keeps metadata_csum_seed, which trixie enables and
    # bullseye did not. That one is INCOMPAT -- a kernel that does not
    # know it refuses the mount outright rather than ignoring it -- but
    # it has been in Linux since 4.4 and every consumer above is far
    # past that, so it is kept on purpose rather than dropped out of
    # caution, and now kept explicitly.
    #
    # The cost is real and is the point. A future e2fsprogs default
    # that would have been desirable never arrives here either, and if
    # a later release renames or drops one of these names this command
    # fails the build instead of quietly producing something else. Loud
    # failure is the trade being made against silent format drift on a
    # disk the whole fleet mounts.
    - name: Make a filesystem on the dependencies disk
      shell: >-
        mkfs.ext4 -O none,has_journal,ext_attr,resize_inode,dir_index,filetype,extent,64bit,flex_bg,metadata_csum_seed,sparse_super,large_file,huge_file,dir_nlink,extra_isize,metadata_csum
        /dev/vdc

    - name: Mount the dependencies disk
      mount:
        path: /srv/ci/cached
        src: /dev/vdc
        fstype: ext4
        state: mounted

    - name: Set ownership of dependencies disk mount
      file:
        path: /srv/ci/cached
        owner: debian
        group: debian

    - name: Cache all minimal images we currently build to reduce network traffic
      get_url:
        url: "{{item.url}}"
        dest: "/srv/ci/cached/{{item.name}}"
        mode: u+r
      loop:
        - {
            url: "https://download.cirros-cloud.net/0.5.2/cirros-0.5.2-x86_64-disk.img",
            name: "cirros",
          }
        - {
            url: "https://images.shakenfist.com/ubuntu:18.04/latest.qcow2",
            name: "ubuntu:18.04",
          }
        - {
            url: "https://images.shakenfist.com/ubuntu:20.04/latest.qcow2",
            name: "ubuntu:20.04",
          }
        - {
            url: "https://images.shakenfist.com/ubuntu:22.04/latest.qcow2",
            name: "ubuntu:22.04",
          }
        - {
            url: "https://images.shakenfist.com/ubuntu:24.04/latest.qcow2",
            name: "ubuntu:24.04",
          }
        - {
            url: "https://images.shakenfist.com/debian:11/latest.qcow2",
            name: "debian:11",
          }
        - {
            url: "https://images.shakenfist.com/debian:12/latest.qcow2",
            name: "debian:12",
          }
        - {
            url: "https://images.shakenfist.com/debian:13/latest.qcow2",
            name: "debian:13",
          }
        - {
            url: "https://images.shakenfist.com/centos:9-stream/latest.qcow2",
            name: "centos:9-stream",
          }
        - {
            url: "https://images.shakenfist.com/fedora:40/latest.qcow2",
            name: "fedora:40",
          }
        - {
            url: "https://images.shakenfist.com/rocky:8/latest.qcow2",
            name: "rocky:8",
          }
        - {
            url: "https://images.shakenfist.com/rocky:9/latest.qcow2",
            name: "rocky:9",
          }
        - {
            url: "https://images.shakenfist.com/rocky:10/latest.qcow2",
            name: "rocky:10",
          }
        - {
            url: "{{ actions_url }}",
            name: "github-actions-runner.tar.gz",
          }

    - name: Clone imago-testdata from GitLab
      git:
        repo: "https://oauth2:{{ gitlab_testdata_token }}@gitlab.home.stillhq.com/private/imago-testdata.git"
        dest: /srv/ci/cached/imago-testdata
        depth: 1
      when: gitlab_testdata_token != ""

    - name: Resparsify imago-testdata images
      shell: |
        cd /srv/ci/cached/imago-testdata
        find downloaded/ -type f \( \
          -name "*.qcow2" -o \
          -name "*.vmdk" -o \
          -name "*.vhd" -o \
          -name "*.vhdx" -o \
          -name "*.img" \
        \) -print0 | while IFS= read -r -d '' file; do
          cp --sparse=always "$file" "$file.sparse"
          mv "$file.sparse" "$file"
        done
      args:
        executable: /bin/bash
      when: gitlab_testdata_token != ""

- hosts: localhost
  gather_facts: no
  connection: ssh
  vars:
    sshkey: '/srv/github/id_ci.pub'
    ssh_private_key: '/srv/github/id_ci'
    # The Debian release of the desktop image whose snapshot is baked
    # onto this disk. The label this playbook looks up and the cached
    # filename it writes have to name the same release, so both are
    # derived from here rather than spelled out at each use. Bumping
    # the desktop image is then one edit in this file -- plus the
    # matched base_image and label pair in ci-image-desktop.yml, and
    # GNOME_LABEL in private-ci's conductor, neither of which a var in
    # this playbook can reach.
    gnome_release: 13
    gnome_label: "debian-gnome-{{ gnome_release }}"
    gnome_cached_name: "debian-{{ gnome_release }}-gnome-agents"
  tasks:
    # The debian-gnome snapshot is baked into the cache disk for the
    # nested desktop CI jobs, but the label only exists once that
    # desktop image itself has been built. On a fresh cluster
    # conductor builds this dependencies image first (it gates all
    # runner provisioning), so a missing gnome label is skipped here
    # rather than failing the build; conductor rebuilds this image
    # once the label exists to bake the snapshot in.
    - name: Look up debian-gnome snapshot artifact
      shell: |
        sf-client --json artifact list | \
            jq -r '.[] | select(.source_url == "sf://label/ci-images/{{ gnome_label }}") | .uuid'
      register: gnome_artifact

    - name: Record whether the debian-gnome label exists
      set_fact:
        gnome_label_exists: "{{ gnome_artifact.stdout_lines | length > 0 }}"

    - name: Note the missing debian-gnome label
      debug:
        msg: >-
          The {{ gnome_label }} label does not exist yet, so its
          snapshot will not be cached on this dependencies disk.
          Rebuild this image after {{ gnome_label }} has been built to
          include it.
      when: not gnome_label_exists | bool

    - name: Log artifact details
      shell: |
        sf-client --json artifact show '{{ gnome_artifact.stdout_lines[-1] }}' | \
            jq '{uuid, source_url, blob_uuid, size}'
      when: gnome_label_exists | bool

    - name: Check runner resources before download
      shell: |
        echo "=== Disk ==="
        df -h /tmp
        echo "=== Memory ==="
        free -m
      when: gnome_label_exists | bool

    - name: Download debian-gnome snapshot
      shell: |
        download_uuid='{{ gnome_artifact.stdout_lines[-1] }}'
        rm -f /tmp/{{ gnome_cached_name }}
        sf-client artifact download ${download_uuid} /tmp/{{ gnome_cached_name }}
        ls -lh /tmp/{{ gnome_cached_name }}
      when: gnome_label_exists | bool

    - name: Check runner resources after download
      shell: |
        echo "=== Disk ==="
        df -h /tmp
        echo "=== Memory ==="
        free -m
      when: gnome_label_exists | bool

    - name: Push debian-gnome snapshot to rebuild instance
      shell: |
        scp -rp -i {{ ssh_private_key }} -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              /tmp/{{ gnome_cached_name }} \
              debian@{{hostvars['imagerebuild']['ansible_ssh_host']}}:/srv/ci/cached/{{ gnome_cached_name }}
      when: gnome_label_exists | bool

- hosts: allsf
  gather_facts: yes
  become: true
  environment:
    http_proxy: http://192.168.1.15:3128
    https_proxy: http://192.168.1.15:3128
    HTTP_PROXY: http://192.168.1.15:3128
    HTTPS_PROXY: http://192.168.1.15:3128
    no_proxy: localhost,127.0.0.1,10.0.0.0/8
    NO_PROXY: localhost,127.0.0.1,10.0.0.0/8

  tasks:
    - name: List contents of /srv/ci/cached
      shell: ls -lrth /srv/ci/cached

    # The actions#66 pattern: end the build by exercising the thing
    # the artifact exists to provide. For this disk that is the cache
    # entries themselves, and until now the only thing looking at them
    # was the `ls` above, whose output nobody reads.
    #
    # Every top level entry here is a cloud image, a release tarball or
    # a desktop snapshot, so all of them are tens of megabytes at the
    # smallest. Anything under a megabyte is not a small file, it is a
    # proxy error page that get_url saved with a 200, or a push that
    # stopped half way. Either publishes as a label and then fails
    # every job that reads it, which is a much more expensive place to
    # find out.
    #
    # A megabyte rather than a kilobyte because the failure this is
    # named after is not a zero byte file: squid returns two to four
    # kilobytes of HTML, which sails past a kilobyte floor and would
    # have made this check a detector of empty files and nothing else.
    # It is still a floor and not an inventory -- a missing entry
    # passes, because what belongs here lives in the get_url loop
    # above and matching the two by hand would rot.
    #
    # Not recursive: imago-testdata is a git clone and is legitimately
    # full of small files.
    - name: Look for cache entries that arrived empty or truncated
      find:
        paths: /srv/ci/cached
        file_type: file
        size: -1m
      register: cached_truncated

    - name: Confirm every cache entry has content
      assert:
        that:
          - cached_truncated.files | length == 0
        fail_msg: >-
          {{ cached_truncated.files | map(attribute='path') | join(', ') }}
          are under a megabyte, which for a cloud image or a release
          tarball means the download did not happen. Publishing this
          disk would give every CI job a cache entry it cannot use.
        success_msg: >-
          Checked {{ cached_truncated.examined }} entries under
          /srv/ci/cached; none were under a megabyte.

    # The size floor above cannot see a disk that ran out of room. The
    # builder's second disk is fixed at 50GB, the images in the get_url
    # loop come to roughly 10.2GB between them, and the imago-testdata
    # clone and the debian-gnome snapshot land on top of that. A
    # download cut off by ENOSPC part way through a several hundred
    # megabyte image is still tens of megabytes on disk, so it passes a
    # one megabyte floor and publishes as a label whose entries every
    # CI job then fails to read. Free space is the signal that does
    # catch it, because ENOSPC leaves essentially none.
    #
    # Two gigabytes is the floor, and the number is chosen from the
    # healthy end rather than the failure end: a full disk reports
    # single digit megabytes, so almost any threshold catches that, but
    # a threshold close to what the disk normally finishes with would
    # start failing builds over ordinary growth of the cached set. The
    # disk has tens of gigabytes spare today, so two leaves plenty of
    # room to grow into while still being far above a filled disk. If a
    # new entry in the loop above ever brings the finished disk near
    # this, the disk wants to be bigger rather than the floor lower.
    - name: Measure free space on the dependencies disk
      command: df --output=avail --block-size=1M /srv/ci/cached
      register: cached_free
      changed_when: false

    - name: Confirm the dependencies disk did not fill up
      assert:
        that:
          - cached_free.stdout_lines[-1] | trim | int >= 2048
        fail_msg: >-
          /srv/ci/cached has only {{ cached_free.stdout_lines[-1] | trim }}MB
          free, so the 50GB disk filled while the downloads above were
          running. A download truncated by ENOSPC is far too large for
          the size floor to notice, so publishing this disk would give
          every CI job cache entries it cannot read.
        success_msg: >-
          /srv/ci/cached has {{ cached_free.stdout_lines[-1] | trim }}MB
          free.

    - name: Unmount the dependencies disk
      mount:
        path: /srv/ci/cached
        state: unmounted

- hosts: localhost
  gather_facts: no
  connection: ssh
  vars:
    identifier: cron
    sshkey: '/srv/github/id_ci.pub'
    ssh_private_key: '/srv/github/id_ci'
    base_image_user: "ubuntu"
    label: "sfci-image"

  tasks:
    - name: Snapshot the instance
      shakenfist.shakenfist.sf_snapshot:
        instance_uuid: "{{hostvars['imagerebuild']['sf_instance_uuid']}}"
        all: true
        state: present
      register: cisnapshot

    - name: Log snapshot details
      debug:
        msg: "{{cisnapshot}}"

    - name: Record the snapshot uuid
      set_fact:
        snapshot_uuid: "{{cisnapshot['meta']['vdc']['blob_uuid']}}"

    - name: Log snapshot uuid
      debug:
        msg: "{{hostvars['localhost']['snapshot_uuid']}}"

- hosts: localhost
  gather_facts: no
  connection: ssh

  tasks:
    - name: Add the snapshot to the label
      shell: |
        sf-client label update "{{label}}" "{{hostvars['localhost']['snapshot_uuid']}}"

    - name: Log the snapshot update
      debug:
        msg: "Set label {{label}} to blob uuid {{hostvars['localhost']['snapshot_uuid']}}"

    - name: Delete the vda snapshot
      shakenfist.shakenfist.sf_snapshot:
        uuid: "{{cisnapshot['meta']['vda']['artifact_uuid']}}"
        state: absent

    - name: Delete the vdc snapshot (its a label now if it passed)
      shakenfist.shakenfist.sf_snapshot:
        uuid: "{{cisnapshot['meta']['vdc']['artifact_uuid']}}"
        state: absent

    - name: Delete build instance
      shakenfist.shakenfist.sf_instance:
        uuid: "{{hostvars['imagerebuild']['sf_instance_uuid']}}"
        namespace: "{{identifier}}"
        state: absent
