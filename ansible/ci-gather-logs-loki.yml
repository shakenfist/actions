---
# Loki-aware CI log gather playbook.
#
# A copy of ci-gather-logs.yml that:
#   (a) ships the Loki-aware clingwrap config
#       (files/shakenfist-ci-failure-loki.cwd) to each node and points
#       `clingwrap gather --target` at that file path. clingwrap resolves
#       a --target that is an existing file path by reading the file
#       directly (clingwrap/main.py gather(): os.path.exists(target) ->
#       open(target)). The built-in target name "shakenfist-ci-failure"
#       is NOT used here.
#   (b) ends with a play on the primary which dumps Loki's view of the
#       run ({job="shakenfist"}) with tools/ci_loki_dump.py and fetches it
#       into the bundle as loki/loki-shakenfist.json, so the central Loki
#       view lands in the aggregated artifact -- useful even when the
#       per-node shipper itself failed.
#
# The localhost play below is the CI RUNNER, not the primary: ansible is
# run from the runner with connection: local. The dump used to curl
# localhost:3100 from that play, found nothing listening, and wrote an
# empty file behind a green task in every bundle (shakenfist/actions#16).
# Loki is installed only on the primary, which every topology names
# "primary" in the inventory, so the dump now runs there.
#
# This is the playbook CI actually runs: smoke-cluster.yml and
# shakenfist's functional-tests.yml both invoke it. The pre-Loki
# ci-gather-logs.yml and clingwrap's built-in .cwd are left unchanged
# beside it.

- hosts: localhost
  gather_facts: yes
  become: yes
  connection: local
  environment:
    http_proxy: http://192.168.1.15:3128
    https_proxy: http://192.168.1.15:3128
    HTTP_PROXY: http://192.168.1.15:3128
    HTTPS_PROXY: http://192.168.1.15:3128
    no_proxy: localhost,127.0.0.1,10.0.0.0/8
    NO_PROXY: localhost,127.0.0.1,10.0.0.0/8
    PIP_INDEX_URL: https://devpi.home.stillhq.com/root/pypi/+simple/

  vars:
    cwd_local_path: "{{ playbook_dir }}/files/shakenfist-ci-failure-loki.cwd"
    cwd_remote_path: /tmp/shakenfist-ci-failure-loki.cwd

  tasks:
    - name: Create artifacts directory
      file:
        path: /srv/github/artifacts
        state: directory
        mode: u+rwx,g+rwx,o+rwx

    - name: Copy Loki-aware clingwrap config to node (localhost fast path)
      copy:
        src: "{{ cwd_local_path }}"
        dest: "{{ cwd_remote_path }}"
        mode: "0644"

    - name: Run clingwrap on node (localhost fast path)
      shell: |
        python3 -mvenv /tmp/clingwrap
        /tmp/clingwrap/bin/pip3 install git+https://github.com/shakenfist/clingwrap
        /tmp/clingwrap/bin/clingwrap gather \
          --target {{ cwd_remote_path }} \
          --output /tmp/{{ inventory_hostname }}.zip

    - name: Extract node zip file (localhost fast path)
      shell: |
        unzip -q /tmp/{{ inventory_hostname }}.zip -d /srv/github/bundle/{{ inventory_hostname }}/ || true
        chmod -R ugo+rw /srv/github/

- hosts: all
  gather_facts: yes
  connection: ssh
  become: yes
  ignore_unreachable: yes
  environment:
    http_proxy: http://192.168.1.15:3128
    https_proxy: http://192.168.1.15:3128
    HTTP_PROXY: http://192.168.1.15:3128
    HTTPS_PROXY: http://192.168.1.15:3128
    no_proxy: localhost,127.0.0.1,10.0.0.0/8
    NO_PROXY: localhost,127.0.0.1,10.0.0.0/8
    PIP_INDEX_URL: https://devpi.home.stillhq.com/root/pypi/+simple/

  vars:
    cwd_local_path: "{{ playbook_dir }}/files/shakenfist-ci-failure-loki.cwd"
    cwd_remote_path: /tmp/shakenfist-ci-failure-loki.cwd

  tasks:
    - block:
      - name: Copy Loki-aware clingwrap config to node
        copy:
          src: "{{ cwd_local_path }}"
          dest: "{{ cwd_remote_path }}"
          mode: "0644"

      - name: Run clingwrap on node
        shell: |
          python3 -mvenv /tmp/clingwrap
          /tmp/clingwrap/bin/pip3 install git+https://github.com/shakenfist/clingwrap
          /tmp/clingwrap/bin/clingwrap gather \
            --target {{ cwd_remote_path }} \
            --output /tmp/{{ inventory_hostname }}.zip

      - name: Stat clingwrap file
        stat:
          path: /tmp/{{ inventory_hostname }}.zip
        register: clingwrap_file_stat

      - name: Dump state of file
        debug:
          msg: "{{ clingwrap_file_stat }}"

      - name: Collect clingwrap zip files
        fetch:
          src: "/tmp/{{ inventory_hostname }}.zip"
          dest: "/tmp/fetched-{{ inventory_hostname }}.zip"
          flat: yes
          fail_on_missing: yes
        register: fetch_result

      # The tasks below run on the CI worker (delegate_to: localhost), so they
      # execute even for a node that never answered SSH -- delegation bypasses
      # the per-host unreachable state that ignore_unreachable keeps in the
      # play. A deliberately-absent hypervisor (the slim-primary topology's
      # sf-absent) produces no fetched zip, and extracting a file that was
      # never fetched hard-fails the whole gather. Skip local extraction for
      # any node the fetch could not reach; reachable nodes are unaffected.
      - name: Extract gathered logs on the CI worker
        delegate_to: localhost
        when: not (fetch_result.unreachable | default(false))
        block:
        - name: List fetched files
          shell: ls -lrt /tmp | grep fetched
          register: file_listing

        - name: Dump fetched file listing
          debug:
            msg: "{{ file_listing.stdout }}"

        - name: Stat fetched file
          stat:
            path: /tmp/fetched-{{ inventory_hostname }}.zip
          register: fetched_file_stat

        - name: Dump state of file
          debug:
            msg: "{{ fetched_file_stat }}"

        - name: Ensure bundle directory exists
          file:
            path: "/srv/github/bundle/{{ inventory_hostname }}"
            state: directory

        - name: Extract node zip file
          shell: |
            unzip -q /tmp/fetched-{{ inventory_hostname }}.zip -d /srv/github/bundle/{{ inventory_hostname }}/ || true
            chmod -R ugo+rw /srv/github/

        - name: List bundle directory
          shell: ls -lrt "/srv/github/bundle/{{ inventory_hostname }}"
          register: file_listing

        - name: Dump bundle file listing
          debug:
            msg: "{{ file_listing.stdout }}"
      when: inventory_hostname != "localhost"

# Central Loki dump. This play is last on purpose: when every host in a
# play fails ansible stops the playbook, and a broken Loki must not cost
# the per-node gather above. It fails the gather step when the dump did
# not work, which is the loud outcome wanted -- the step carries
# continue-on-error in every caller, so a merge is not gated on it.
- hosts: primary
  gather_facts: no
  ignore_unreachable: yes

  vars:
    # Wide window: the CI Loki is fresh per run, so everything in it is
    # from this run. 6h comfortably covers a CI run.
    loki_query_window_seconds: 21600
    loki_dump_remote_path: /tmp/loki-shakenfist.json

  tasks:
    - name: Dump central Loki view on the primary
      script: >-
        {{ playbook_dir }}/../tools/ci_loki_dump.py
        --window-seconds {{ loki_query_window_seconds }}
        --output {{ loki_dump_remote_path }}
      args:
        executable: python3
      register: loki_dump
      ignore_errors: yes

    # The file is fetched whether or not the dump worked: on failure it
    # holds a "status" saying why, so the bundle says so too rather than
    # carrying an empty file that reads like a quiet cluster.
    - name: Fetch the Loki dump into the bundle
      fetch:
        src: "{{ loki_dump_remote_path }}"
        dest: /srv/github/bundle/loki/loki-shakenfist.json
        flat: yes
        fail_on_missing: no

    - name: Report the Loki dump
      debug:
        msg: "{{ loki_dump.stdout | default('') | trim }}"

    # The script prints its reason to stderr, but the script module runs it
    # over ssh with a tty, which merges stderr into stdout. Fall back to
    # stdout so this task names the reason rather than ansible's generic
    # "non-zero return code".
    - name: Fail the gather if the Loki dump did not work
      fail:
        msg: >-
          {{ (loki_dump.stderr | default('') | trim)
             or (loki_dump.stdout | default('') | trim)
             or (loki_dump.msg | default('the Loki dump did not run')) }}
      when: loki_dump is failed or loki_dump is unreachable
