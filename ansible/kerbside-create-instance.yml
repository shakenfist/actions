---
- name: Create an instance
  shakenfist.shakenfist.sf_instance:
    name: "{{ instance_name }}"
    cpu: "{{ vcpus }}"
    ram: "{{ memory }}"
    disks:
      - "400@{{base}}"
    networkspecs:
      - network_uuid={{ environment_name }},address={{ address }},float=true
      - network_uuid={{ environment_name }},address=none
    ssh_key: "{{ lookup('file', sshkey) }}"
    namespace: "{{ identifier }}"
    side_channels:
      - sf-agent2
    metadata:
      # Ansible templates dict values but not dict keys, so the tag must
      # be folded into the affinity dict inside an expression. As a bare
      # key, "{{ tag }}" reached the scheduler as a literal string that
      # matched no instance tags, silently disabling anti-affinity (seen
      # in the sf-6 OOM incidents of 2026-08-04/05).
      affinity: "{{ {tag: -50} }}"
      tags:
       - "{{ tag }}"
    user_data: ""
    state: present
    await: true
    await_timeout: 600
    # What is left of the calling play's capacity_wait_budget, which the
    # kerbside-*.yml playbooks set. A play which sets no budget, or sets
    # it to 0, sends no capacity_wait at all: it behaves exactly as it did
    # before, and still works against a collection without the option.
    # A homelab overlay which imports kerbside-single-node.yml gets that
    # playbook's budget, and passes capacity_wait_budget=0 to opt out.
    capacity_wait: >-
      {{ ([capacity_wait_budget | int - sf_capacity_waited | default(0) | int, 0] | max)
      if capacity_wait_budget | default(0) | int > 0 else omit }}
  register: new_instance

# A fact rather than an include var, so that the total carries over from
# one include of this file to the next.
- name: Count the time this create waited for capacity
  set_fact:
    sf_capacity_waited: >-
      {{ sf_capacity_waited | default(0) | int
      + new_instance.capacity_waited.seconds | default(0) | int }}

- name: Log environment instance
  debug:
    msg:
      - "New instance: {{ new_instance }}"

# Decide which IP to expose as ansible_ssh_host. Default behaviour
# (used by CI) is the internal address on the test network — the runner
# is itself a ShakenFist instance and routes onto that network. Callers
# outside the SF fabric (homelab overlays etc.) set prefer_floating_ip
# to true on the calling play to get the floating IP instead.
- name: Determine ssh host for the new instance
  set_fact:
    _new_instance_ssh_host: >-
      {{ new_instance['meta']['interfaces'][0]['floating']
         if (prefer_floating_ip | default(false) | bool
             and new_instance['meta']['interfaces'][0]['floating'] | default('', true))
         else new_instance['meta']['interfaces'][0]['ipv4'] }}

- name: Add node to ansible
  add_host:
    hostname: "{{ instance_name }}"
    egress_ip: "{{ new_instance['meta']['interfaces'][0]['ipv4'] }}"
    egress_floating_ip: "{{ new_instance['meta']['interfaces'][0]['floating'] | default('', true) }}"
    ansible_ssh_host: "{{ _new_instance_ssh_host }}"
    ansible_ssh_extra_args: "-o StrictHostKeyChecking=no -o GlobalKnownHostsFile=/dev/null -o UserKnownHostsFile=/dev/null"
    ansible_ssh_user: "{{ base_user | default('debian') }}"
    ansible_ssh_private_key_file: "{{ ssh_private_key }}"
    sf_uuid: "{{ new_instance['meta']['uuid'] }}"
    groups: allsf
