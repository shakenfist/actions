# Hold the deployment's VIP in IPAM before anything else is allocated.
#
# Shaken Fist allocates addresses from a network's block at random and only
# knows about the addresses it allocated itself. The VIP a deployment brings
# up with keepalived is written into its own configuration (kerbside-patches
# pins kolla_internal_vip_address at 10.0.2.3), so as far as IPAM is
# concerned that address is free, and eventually it hands it to an interface
# -- the CI runner's own interface on this network is the usual victim, since
# that is the next thing allocated here. The deployment then refuses to
# install, because its prechecks ping the VIP and something answers
# (kerbside-patches CI run 35202102331).
#
# The reservation takes the address out of the pool and does nothing else:
# no interface, no DHCP entry, no routing.
#
# Three failures are tolerated on purpose, because a merge here reaches the
# whole fleet at once and a hard failure would break every consumer until the
# server, the client and the runner images have all rolled out:
#
#   * An sf-client which does not know the verb, or is not installed at all.
#     That is what the probe below is for. An old client answers "No such
#     command 'reserve-address'" with rc 2 and a missing one rc 127, and the
#     reservation task could not tell either apart from a real refusal.
#   * A cluster which does not advertise the reserve-addresses capability.
#     The client raises IncapableException, whose text says the server "does
#     not support" the request.
#   * An address which is already reserved, which is this playbook being
#     re-run against a network that still exists, and is a no-op.
#
# Anything else -- an unauthenticated client, a malformed address, a server
# error -- is a real failure and stops the run.
- name: The deployment VIP must be an address in the test network
  assert:
    that:
      - vip_address | length > 0
      # The same 10.0.2.0/24 the playbooks hand to sf_network. Spelled out
      # rather than derived from it because the runners carry ansible-core
      # alone, without the collection which provides the ipaddr filter. The
      # octets are bracketed rather than backslash-escaped so that the
      # pattern means the same thing however Jinja handles escapes, and
      # the last one is spelled out so that a typo the API would only
      # reject as a malformed request is named here instead;
      # tests/test_vip_reservation.py is what keeps the two in agreement.
      - vip_address is match('^10[.]0[.]2[.]([1-9]|[1-9][0-9]|1[0-9][0-9]|2[0-4][0-9]|25[0-4])$')
    fail_msg: >-
      vip_address is "{{ vip_address }}", which is not a host address in the
      test network's 10.0.2.0/24 block. It must match
      kolla_internal_vip_address in the globals file being deployed.

- name: Check whether this sf-client can reserve an address
  shell: sf-client network reserve-address --help
  register: vip_reservation_probe
  changed_when: false
  failed_when: false

- name: Reserve the deployment VIP so that IPAM never allocates it
  shell: |
    sf-client network reserve-address "{{ environment_name }}" "{{ vip_address }}" \
        --comment "deployment VIP for {{ identifier }}"
  register: vip_reservation
  when: vip_reservation_probe.rc == 0
  changed_when: vip_reservation.rc == 0
  failed_when: >-
    vip_reservation.rc != 0 and
    'Resource state conflict' not in (vip_reservation.stdout + vip_reservation.stderr) and
    'does not support' not in (vip_reservation.stdout + vip_reservation.stderr)

- name: Warn when the VIP could not be reserved
  debug:
    msg:
      - "Could not reserve {{ vip_address }} on network {{ environment_name }}."
      - "This cluster or sf-client predates the reserve-addresses capability,"
      - "so the VIP remains allocatable and this deployment may collide with it."
      - "{{ vip_reservation_output }}"
  vars:
    vip_reservation_output: >-
      {{ (vip_reservation_probe.stdout + vip_reservation_probe.stderr)
         if vip_reservation is skipped
         else (vip_reservation.stdout + vip_reservation.stderr) }}
  when: vip_reservation is skipped or
        (vip_reservation.rc != 0 and
         'does not support' in (vip_reservation.stdout + vip_reservation.stderr))
