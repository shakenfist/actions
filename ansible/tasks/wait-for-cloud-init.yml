# Readiness gate for a freshly provisioned instance.
#
# A "wait_for" on port 22 with search_regex: OpenSSH only proves that sshd
# is listening and has emitted a banner. It neither authenticates nor waits
# for cloud-init to finish: sshd presents a banner early in boot, the wait
# passes, and then cloud-init regenerates the host keys and restarts sshd.
# Anything connecting in that window is dropped with "connection refused",
# which is a load-dependent CI flake (shakenfist/actions issue #2).
#
# Include these tasks from a play targeting the provisioned hosts
# themselves, after the cheap banner wait_for -- that wait is still worth
# keeping as an early fast failure for a guest that never booted at all.
#
# There are no required vars: the play's hosts supply the connection
# details established by the provisioning play's add_host.
#
# tests/test_ansible_readiness.py checks that every playbook which creates
# instances imports this file after doing so, so a new playbook cannot
# quietly go back to the banner-only wait.
#
# Nothing in this file may run an Ansible module on the target, which is
# why the probe below is an ssh command run on the controller and the
# cloud-init wait is raw. A module reaches a managed node as an AnsiballZ
# wrapper whose first statement is "from __future__ import annotations",
# and it imports module_utils, which declares _PY_MIN = (3, 9). Both want
# a Python the oVirt lane's guest does not have: Rocky 8's python3 is
# 3.6, where that import is a syntax error, so every module dies there
# before it can report anything. This gate used wait_for_connection,
# whose probe is the ping module, and that is exactly how it failed --
# 300 seconds of the same KeyError, reported as "timed out waiting for
# ping module test: 'ping'", against a guest which was up and taking ssh
# the whole time. See shakenfist/kerbside#446. Readiness is an ssh
# question, so ask it over ssh, and the gate keeps working on any guest
# we can log into rather than only on the ones Ansible can still manage.
#
# The probe is a command delegated to the controller rather than a raw
# task with until/retries because retries do not apply to an unreachable
# host: Ansible ignores that host on the first attempt and the play moves
# on. It would step over the sshd restart window this file exists to
# close, and do it silently.
- name: Wait for SSH to accept an authenticated connection
  delegate_to: localhost
  # hostvars[inventory_hostname] rather than the bare connection vars: in
  # a delegated task those resolve against the delegate, which here is the
  # controller, so the bare names would probe localhost and pass the gate
  # without ever touching the guest.
  vars:
    gate_target: "{{ hostvars[inventory_hostname] }}"
  ansible.builtin.command:
    # cmd rather than argv: ansible_ssh_extra_args is one string holding
    # several options, which argv would hand to ssh as a single argument.
    # cmd is split the way a shell would split it, so they arrive as the
    # options they are.
    #
    # timeout caps an ssh which connects and then hangs, which
    # ConnectTimeout does not cover; that becomes rc 124 and another
    # attempt rather than a stalled play. BatchMode stops a guest which
    # is up but will not take the key from sitting on a password prompt
    # for the whole retry budget.
    #
    # The host key options come from the add_host that created this host
    # rather than being repeated here, because a gate which checked the
    # host key when the connections around it do not would fail on the
    # very key cloud-init is about to regenerate.
    cmd: >-
      timeout 30
      ssh -i {{ gate_target.ansible_ssh_private_key_file }}
      -o BatchMode=yes
      -o ConnectTimeout=5
      {{ gate_target.ansible_ssh_extra_args | default('') }}
      {{ gate_target.ansible_ssh_user }}@{{ gate_target.ansible_ssh_host }}
      /bin/true
  register: gate_connection
  # 60 attempts five seconds apart is the 300s the wait_for_connection
  # this replaced was allowed, so the budget documented in
  # docs/ansible.md is unchanged.
  until: gate_connection.rc == 0
  retries: 60
  delay: 5
  changed_when: false

# `--wait` blocks until cloud-init reaches a terminal state, then exits
# non-zero if that state is "error" or "degraded". This gate exists to wait
# out the cloud-init window (so sshd has stopped bouncing), not to assert
# that cloud-init succeeded -- a genuinely broken guest surfaces with a
# clearer error in the real tasks that follow. So tolerate the exit code:
# we only care that --wait returned, meaning cloud-init is done. The same
# tolerance covers an image with no cloud-init installed at all, which
# raw reports as the shell's own rc 127.
#
# --wait has no timeout of its own and will block forever on a guest whose
# cloud-init never reaches a terminal state, which in CI means burning the
# whole workflow timeout rather than failing the job. Cap it with
# coreutils timeout so that case costs ten minutes and then proceeds to
# the real tasks, which fail with something diagnosable. Counting the
# retry below, the worst case for one gate is closer to twenty minutes:
# 300s here, an unreachable attempt, 300s waiting for the replacement
# sshd, and 600s in the retry. ci-image.yml and ci-image-desktop.yml
# import this file twice each. On the normal path, where cloud-init has
# already finished, the whole gate costs seconds.
#
# One case --wait does not cover: on older cloud-init the wait loop only
# re-polls while the status is "running", so a status of "not run" returns
# rc 0 immediately rather than waiting. That needs cloud-init to not have
# started at all, which the task above has already ruled out -- Shaken
# Fist delivers the ssh key by config drive, so cloud-init has run its
# init stage before any authenticated connection can succeed.
#
# become is not strictly needed to read the status, but it is what the
# original kerbside gate did and it is harmless here for the same reason
# the paragraph above gives: the default user's sudoers drop-in and its
# ssh key are both written by cloud-init's init stage, so a host which
# has authenticated us can also sudo. If become did somehow fail,
# failed_when: false would swallow it and this gate would wait for
# nothing, so the tasks at the bottom of this file call that case out on
# a line of its own rather than reporting it as an unremarkable unknown.
#
# ignore_unreachable is the other half of the sshd bounce, handled below.
- name: Wait for cloud-init to finish
  become: true
  ansible.builtin.raw: timeout 600 cloud-init status --wait
  changed_when: false
  failed_when: false
  ignore_unreachable: true
  register: cloud_init_first

# The probe returns on the first connection that authenticates, which is
# normally the pre-restart sshd, so the task above can still land inside
# the bounce and come back unreachable rather than with an rc -- the very
# flake this file exists to remove, just moved one task later.
# ignore_unreachable stops that from killing the play, and here we wait for
# the replacement sshd and ask again. By the time cloud-init reports a
# terminal state it has finished restarting sshd, so one retry is enough.
- name: Retry cloud-init if sshd restarted underneath the last task
  when: cloud_init_first.unreachable | default(false)
  block:
    - name: Wait for SSH again after the sshd restart
      delegate_to: localhost
      vars:
        gate_target: "{{ hostvars[inventory_hostname] }}"
      ansible.builtin.command:
        cmd: >-
          timeout 30
          ssh -i {{ gate_target.ansible_ssh_private_key_file }}
          -o BatchMode=yes
          -o ConnectTimeout=5
          {{ gate_target.ansible_ssh_extra_args | default('') }}
          {{ gate_target.ansible_ssh_user }}@{{ gate_target.ansible_ssh_host }}
          /bin/true
      register: gate_connection
      until: gate_connection.rc == 0
      retries: 60
      delay: 5
      changed_when: false

    - name: Wait for cloud-init to finish, after the sshd restart
      become: true
      ansible.builtin.raw: timeout 600 cloud-init status --wait
      changed_when: false
      failed_when: false
      ignore_unreachable: true
      register: cloud_init_retry

# A task skipped by its block's when: still registers, as a result whose
# only interesting key is skipped: true. Registering the retry over the
# first attempt's variable therefore erased it on the normal path, where
# the retry does not run -- so the two tasks below saw no rc at all and
# reported every healthy gate as one that "never ran". Keep the two
# results apart and choose between them here instead. set_fact is an
# action plugin, evaluated on the controller, so this costs the target
# nothing.
- name: Settle which cloud-init result to report
  ansible.builtin.set_fact:
    cloud_init_status: >-
      {{ cloud_init_retry
         if (cloud_init_retry is defined
             and not (cloud_init_retry.skipped | default(false)))
         else cloud_init_first }}

# Every path through this gate is tolerant -- failed_when: false,
# ignore_unreachable on both attempts, and the timeout cap -- which is
# right for the exit code but means a broken gate and a satisfied one
# look alike at a glance. rc 124 is the cap firing, so cloud-init never
# reached a terminal state; a missing rc means the command never ran.
# Both put the run back in the window this file exists to close, so they
# get a line of their own rather than one interpolated field below.
- name: Warn when the gate did not actually wait
  when: cloud_init_status.rc is not defined or cloud_init_status.rc == 124
  ansible.builtin.debug:
    msg: >-
      WARNING: the cloud-init readiness gate did not complete on
      {{ inventory_hostname }}, so this host may still be inside the
      sshd restart window. See ansible/tasks/wait-for-cloud-init.yml.

# rc is defaulted because the tasks above are deliberately failure
# tolerant: a result which never produced an rc at all (an unreachable
# host both times, or a become failure) must not turn this log line into
# the thing that fails the play. That case is worth saying out loud
# though, because it means the gate returned without waiting for
# anything, and a bare "unknown" is easy to read past in a long CI log.
- name: Log the cloud-init state
  ansible.builtin.debug:
    msg: >-
      cloud-init on {{ inventory_hostname }}:
      rc={{ cloud_init_status.rc | default('NONE -- the check never ran') }}
      {{ cloud_init_status.stdout | default('') | trim }}
      {{ cloud_init_status.stderr | default('') | trim }}
