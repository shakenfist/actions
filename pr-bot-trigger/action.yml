name: 'PR Bot Trigger Handler'
description: >
  Handle @shakenfist-bot trigger comments on pull requests. Validates user
  permissions and that the pull request is not from a fork, adds a reaction
  to the comment, posts status messages, and outputs PR details for
  downstream jobs.

inputs:
  trigger-phrase:
    description: 'The phrase to look for (without the @shakenfist-bot prefix)'
    required: true
  reaction:
    description: 'Reaction emoji to add to the comment (rocket, +1, eyes, etc.)'
    required: false
    default: 'rocket'
  starting-message:
    description: >
      Message to post when starting. Supports placeholders:
      {pr_ref} - PR branch name
      {run_url} - URL to the workflow run
      Leave empty to skip posting a message.
    required: false
    default: ''
  unauthorized-message:
    description: >
      Message to post when user is not authorized. Supports {username}.
      Leave empty to use the default message.
    required: false
    default: ''

outputs:
  authorized:
    description: >
      Whether this request may proceed (true/false). True only when the
      commenter has write access AND the pull request comes from a branch
      in this repository. Callers gate their work on this single output,
      so a fork pull request skips their jobs without them changing.
    value: ${{ steps.gate.outputs.authorized }}
  same-repo:
    description: >
      Whether the pull request head is a branch in this repository
      (true/false). Callers do not normally need this -- it is already
      folded into `authorized` -- but it distinguishes the two refusals.
    value: ${{ steps.check_origin.outputs.same_repo }}
  head-repo:
    description: >
      The full name of the repository the pull request head lives in, or
      empty when the fork has been deleted.
    value: ${{ steps.check_origin.outputs.head_repo }}
  pr-number:
    description: 'The PR number'
    value: ${{ github.event.issue.number }}
  pr-ref:
    description: 'The PR branch ref'
    value: ${{ steps.pr_details.outputs.pr_ref }}
  triggered:
    description: 'Whether the trigger phrase matched (true/false)'
    value: ${{ steps.check_trigger.outputs.triggered }}
  confirmed:
    description: >
      Whether the action vouches for this request proceeding (true/false).
      True only when every output above that a caller acts on was
      determined: triggered and authorized are both 'true', same-repo is
      'true', and pr-ref is set. When the action acknowledged a request
      but cannot vouch for those, it fails and says so on the pull request
      itself, so a caller gating on this output needs no check of its own.
    value: ${{ steps.confirm.outputs.confirmed }}

runs:
  using: "composite"
  steps:
    - name: Check trigger phrase
      id: check_trigger
      shell: bash
      env:
        COMMENT_BODY: ${{ github.event.comment.body }}
        TRIGGER_PHRASE: ${{ inputs.trigger-phrase }}
      run: |
        # Check if comment contains the trigger phrase
        if [[ "${COMMENT_BODY}" == *"@shakenfist-bot ${TRIGGER_PHRASE}"* ]]; then
          echo "triggered=true" >> $GITHUB_OUTPUT
          echo "Trigger phrase found: @shakenfist-bot ${TRIGGER_PHRASE}"
        else
          echo "triggered=false" >> $GITHUB_OUTPUT
          echo "Trigger phrase not found"
        fi

    - name: Check commenter permissions
      id: check_permission
      if: steps.check_trigger.outputs.triggered == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        COMMENTER: ${{ github.event.comment.user.login }}
      run: |
        permission=$(gh api \
          "repos/${{ github.repository }}/collaborators/${COMMENTER}/permission" \
          --jq '.permission' 2>/dev/null || echo "none")

        echo "User ${COMMENTER} has permission: ${permission}"

        if [[ "${permission}" == "admin" || "${permission}" == "write" ]]; then
          echo "permitted=true" >> $GITHUB_OUTPUT
          echo "User is authorized"
        else
          echo "permitted=false" >> $GITHUB_OUTPUT
          echo "User is not authorized"
        fi

    # SECURITY: bot commands are refused on fork pull requests.
    #
    # pr_ref below is .head.ref, the branch name *in the head
    # repository*, and it carries no indication of which repository that
    # is. Callers hand it to actions/checkout and to `git push origin
    # HEAD:refs/heads/<ref>` against *this* repository. Fork pull
    # requests are very commonly opened from the fork's own default
    # branch, so .head.ref is literally "main" -- and then the checkout
    # silently succeeds against this repository's main, the bot commits
    # to it, and the push lands unreviewed commits on the branch every
    # consumer in the fleet pins at @main. No malice is required: a
    # maintainer typing the trigger phrase on a fork pull request is
    # enough.
    #
    # This is refused here rather than in each caller so the guard
    # cannot be lost when a project edits its workflows, which is the
    # same reasoning pr-auto-review.yml gives for owning its own fork
    # restriction. Every caller of this action either pushes to the head
    # branch or dispatches a workflow against it, so none of them has a
    # meaningful fork behaviour to lose.
    - name: Check the pull request is not from a fork
      id: check_origin
      if: steps.check_trigger.outputs.triggered == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # `// empty` because .head.repo is null when the fork has been
        # deleted, and an empty head repository is not this one.
        head_repo=$(gh api \
          "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" \
          --jq '.head.repo.full_name // empty')

        echo "head_repo=${head_repo}" >> $GITHUB_OUTPUT
        echo "Pull request head lives in: ${head_repo:-<deleted fork>}"

        if [ "${head_repo}" = "${{ github.repository }}" ]; then
          echo "same_repo=true" >> $GITHUB_OUTPUT
        else
          echo "same_repo=false" >> $GITHUB_OUTPUT
          echo "Refusing: bot commands are not supported on fork pull requests."
        fi

    # The single verdict callers gate on. Both conditions have to hold,
    # and folding them together here is what lets an existing caller
    # inherit the fork guard without editing its `if:` expressions.
    - name: Decide whether this request may proceed
      id: gate
      if: steps.check_trigger.outputs.triggered == 'true'
      shell: bash
      env:
        PERMITTED: ${{ steps.check_permission.outputs.permitted }}
        SAME_REPO: ${{ steps.check_origin.outputs.same_repo }}
      run: |
        if [ "${PERMITTED}" = "true" ] && [ "${SAME_REPO}" = "true" ]; then
          echo "authorized=true" >> $GITHUB_OUTPUT
        else
          echo "authorized=false" >> $GITHUB_OUTPUT
        fi

    - name: React to comment
      if: >
        steps.check_trigger.outputs.triggered == 'true' &&
        steps.gate.outputs.authorized == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REACTION: ${{ inputs.reaction }}
      run: |
        gh api \
          "repos/${{ github.repository }}/issues/comments/${{ github.event.comment.id }}/reactions" \
          -f content="${REACTION}" \
          --silent || true

    - name: Post unauthorized message
      if: >
        steps.check_trigger.outputs.triggered == 'true' &&
        steps.check_permission.outputs.permitted == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CUSTOM_MESSAGE: ${{ inputs.unauthorized-message }}
        USERNAME: ${{ github.event.comment.user.login }}
        TRIGGER_PHRASE: ${{ inputs.trigger-phrase }}
      run: |
        if [ -n "${CUSTOM_MESSAGE}" ]; then
          message="${CUSTOM_MESSAGE/\{username\}/${USERNAME}}"
        else
          message="Sorry @${USERNAME}, only repository collaborators with write access can request this action."
        fi

        gh pr comment "${{ github.event.issue.number }}" \
          --repo "${{ github.repository }}" \
          --body "${message}"

    - name: Post fork-not-supported message
      if: >
        steps.check_trigger.outputs.triggered == 'true' &&
        steps.check_permission.outputs.permitted == 'true' &&
        steps.check_origin.outputs.same_repo == 'false'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_REPO: ${{ steps.check_origin.outputs.head_repo }}
      run: |
        gh pr comment "${{ github.event.issue.number }}" \
          --repo "${{ github.repository }}" \
          --body "$(printf '%s\n' \
            "Bot commands are not supported on pull requests from forks." \
            "" \
            "This pull request's head branch lives in \`${HEAD_REPO:-a deleted fork}\`, not in this repository. The bot workflows check out and push to a branch *here* by the head branch's name, which would act on the wrong branch entirely -- and a fork pull request opened from the fork's default branch would name \`main\`." \
            "" \
            "Push the branch to this repository and open a pull request from it if you need the bot lane.")"

    - name: Get PR details
      id: pr_details
      if: >
        steps.check_trigger.outputs.triggered == 'true' &&
        steps.gate.outputs.authorized == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        PR_REF=$(gh api \
          "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" \
          --jq '.head.ref')

        # Validate branch name for security
        if ! [[ "${PR_REF}" =~ ^[a-zA-Z0-9/_.-]+$ ]]; then
          echo "Error: Invalid branch name format: ${PR_REF}"
          exit 1
        fi

        if [[ "${PR_REF}" == -* ]]; then
          echo "Error: Branch name cannot start with hyphen: ${PR_REF}"
          exit 1
        fi

        echo "pr_ref=${PR_REF}" >> $GITHUB_OUTPUT
        echo "PR branch: ${PR_REF}"

    - name: Post starting message
      if: >
        steps.check_trigger.outputs.triggered == 'true' &&
        steps.gate.outputs.authorized == 'true' &&
        inputs.starting-message != ''
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        MESSAGE_TEMPLATE: ${{ inputs.starting-message }}
        PR_REF: ${{ steps.pr_details.outputs.pr_ref }}
        RUN_URL: "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      run: |
        message="${MESSAGE_TEMPLATE}"
        message="${message//\{pr_ref\}/${PR_REF}}"
        message="${message//\{run_url\}/${RUN_URL}}"

        gh pr comment "${{ github.event.issue.number }}" \
          --repo "${{ github.repository }}" \
          --body "${message}"

    # Callers used to open-code this: each bot workflow re-read
    # triggered, authorized and same-repo, failed when one was neither
    # 'true' nor 'false', and told the requester. The copies drifted
    # (shakenfist/actions#126), and the property they check belongs to
    # this action, so it is checked here once.
    #
    # The env below must read exactly the expressions the outputs block
    # above exports -- that is what makes this a check of what callers
    # receive rather than of what the earlier steps meant to write.
    # tests/test_workflow_references.py holds the two lists together.
    #
    # The failure that matters is the quiet one: a request acknowledged
    # with a reaction whose downstream job is then skipped on an empty
    # output. Failing here makes it visible, and the step after this
    # one says so on the pull request.
    - name: Confirm what this action reports
      id: confirm
      shell: bash
      env:
        TRIGGERED: ${{ steps.check_trigger.outputs.triggered }}
        AUTHORIZED: ${{ steps.gate.outputs.authorized }}
        SAME_REPO: ${{ steps.check_origin.outputs.same_repo }}
        PR_REF: ${{ steps.pr_details.outputs.pr_ref }}
      run: |
        fail() {
          echo "$1"
          echo "pr-bot-trigger cannot vouch for this request, so it will not run."
          exit 1
        }
        case "${TRIGGERED}" in
          false)
            echo "confirmed=false" >> "${GITHUB_OUTPUT}"
            exit 0
            ;;
          true) ;;
          *) fail "triggered is '${TRIGGERED}', not true or false." ;;
        esac
        case "${AUTHORIZED}" in
          false)
            echo "confirmed=false" >> "${GITHUB_OUTPUT}"
            exit 0
            ;;
          true) ;;
          *) fail "authorized is '${AUTHORIZED}', not true or false." ;;
        esac
        if [ "${SAME_REPO}" != "true" ]; then
          fail "authorized is true but same-repo is '${SAME_REPO}'."
        fi
        if [ -z "${PR_REF}" ]; then
          fail "authorized is true but pr-ref is empty."
        fi
        echo "confirmed=true" >> "${GITHUB_OUTPUT}"

    # The requester has usually had the reaction by now, and the run log
    # is not somewhere they will look. Gated on the step above rather
    # than on any failure: an earlier step failing is an API or input
    # error with its own message in the log, not this action and its
    # callers disagreeing. The body is fixed text: nothing from the
    # comment reaches it.
    - name: Tell the requester the request will not run
      if: failure() && steps.confirm.outcome == 'failure'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        body="This request was acknowledged but will not run: pr-bot-trigger"
        body="${body} could not confirm what it reports about the pull request,"
        body="${body} which is a defect in the workflow rather than in the pull"
        body="${body} request. The [run log](${RUN_URL}) has the detail."
        gh pr comment "${{ github.event.issue.number }}" \
          --repo "${{ github.repository }}" \
          --body "${body}"
