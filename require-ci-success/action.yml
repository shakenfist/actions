name: 'Require CI success'
description: >-
  Fail unless the named CI workflows succeeded on a commit, so that a
  release cannot publish code CI did not pass. The commit must be on the
  default branch's first-parent history, within its newest 500 commits:
  a tag named like the branch gives its runs that branch name, so only a
  commit the branch itself pointed at can carry CI for it, and a commit
  merged in from a feature branch is reachable but never was. A run
  counts only if it was a push to the default branch or a merge queue
  run for it, from this repository, and every such run is judged at its
  latest attempt: one that did not succeed fails the gate.
  A commit no named workflow ran on is crossed to its first parent only
  when it changed nothing but review marks (REVIEWS.md, .vscode/*.weaudit
  and .vscode/*.weaudit-shas.json), and never when it is a merge. There
  is no override: re-run the failed CI, then re-run this job. The logic is
  tools/require-ci-success.py, resolved through github.action_path, so it
  comes from the same ref as this action.yml. It needs gh on the runner,
  and the token needs actions: read and contents: read. Composite-action
  steps cannot carry timeouts, so put timeout-minutes on the step that
  uses this action.

inputs:
  workflows:
    description: >-
      The workflow files that must have succeeded, one per line, each a
      bare file name in .github/workflows/ such as ci.yml, not a path.
      Blank lines and duplicates are ignored; naming none is an error.
    required: true
  sha:
    description: 'The full 40-character sha of the commit to check. Defaults to the commit the workflow runs on.'
    required: false
    default: ${{ github.sha }}
  token:
    description: 'A token with actions: read and contents: read on this repository.'
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    # Inputs reach the script through env:, never interpolated into a
    # command line: an input carrying a quote or a shell metacharacter
    # would otherwise run as shell here. -I makes python ignore PYTHON*
    # environment variables and the user site directory, either of which
    # the caller's job could set to change what the script imports.
    # Running a script already puts its own directory, not the working
    # directory, first on the import path.
    - name: Require CI success on the commit
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        WORKFLOWS: ${{ inputs.workflows }}
        COMMIT_SHA: ${{ inputs.sha }}
      run: 'python3 -I "${GITHUB_ACTION_PATH}/../tools/require-ci-success.py"'
