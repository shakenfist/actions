name: 'Review PR with Claude'
description: >
  Run an automated code review on a pull request using Claude Code.
  Produces a structured JSON review, creates GitHub issues for
  actionable items, renders to markdown, and posts as a PR comment.
  The calling job needs pull-requests: write and issues: write
  permissions.

inputs:
  pr-number:
    description: 'The PR number to review'
    required: true
  max-turns:
    description: >
      Maximum Claude turns. Leave unset, or pass "auto", and the budget
      is scaled from the diff size, which is what you want: a fixed
      budget is either wasteful on a small diff or too small on a large
      one, and running out costs the whole review. Passing an integer
      pins the budget and opts out of that scaling.
    required: false
    default: ''
  force:
    description: 'Review even if bot has already reviewed'
    required: false
    default: 'false'

runs:
  using: "composite"
  steps:
    - name: Run automated reviewer
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_MAX_TURNS: ${{ inputs.max-turns }}
        INPUT_FORCE: ${{ inputs.force }}
      run: |
        ${{ github.action_path }}/review-pr-with-claude.sh
