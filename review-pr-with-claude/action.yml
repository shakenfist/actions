name: 'Review PR with Claude'
description: >
  Run an automated code review on a pull request using Claude Code.
  Produces a structured JSON review, renders it to markdown, and posts
  it as a PR review. The calling job needs contents: read and
  pull-requests: write permissions.

inputs:
  pr-number:
    description: 'The PR number to review'
    required: true
  max-turns:
    description: >
      Maximum Claude turns. Leave unset, or pass "auto", and the budget
      is scaled from the diff size, which is what you want: a fixed
      budget is either wasteful on a small diff or too small on a large
      one, and running out costs the whole review. Passing an integer
      pins the budget and opts out of that scaling.
    required: false
    default: ''
  force:
    description: 'Review even if bot has already reviewed'
    required: false
    default: 'false'

outputs:
  review-posted:
    description: >
      'true' when a review was posted to the pull request. Every green
      run that posted nothing sets 'false', and so does a red one that
      got as far as checking for an earlier review, so a caller can
      tell "the job passed" apart from "the pull request was reviewed".
    value: ${{ steps.review.outputs.review_posted }}
  review-skipped:
    description: >
      Why no review was posted, on the green paths that post none:
      already_reviewed, diff_too_large, turn_budget_exhausted or
      truncated_unusable. Empty otherwise.
    value: ${{ steps.review.outputs.review_skipped }}
  review-truncated:
    description: >
      'true' when the response was cut off: the posted review is then
      partial, or nothing could be salvaged. Empty otherwise.
    value: ${{ steps.review.outputs.review_truncated }}
  claude-turns:
    description: 'Turns the reviewer used, or "unknown"'
    value: ${{ steps.review.outputs.claude_turns }}
  claude-duration-ms:
    description: 'How long the reviewer ran, in milliseconds, or "unknown"'
    value: ${{ steps.review.outputs.claude_duration_ms }}
  claude-cost-usd:
    description: 'What the reviewer run cost in US dollars, or "unknown"'
    value: ${{ steps.review.outputs.claude_cost_usd }}
  claude-subtype:
    description: >
      How the reviewer run ended, as the CLI reports it: success,
      error_max_turns or error_during_execution, or "unknown".
    value: ${{ steps.review.outputs.claude_subtype }}

runs:
  using: "composite"
  steps:
    - name: Run automated reviewer
      id: review
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        INPUT_PR_NUMBER: ${{ inputs.pr-number }}
        INPUT_MAX_TURNS: ${{ inputs.max-turns }}
        INPUT_FORCE: ${{ inputs.force }}
      run: |
        ${{ github.action_path }}/review-pr-with-claude.sh
